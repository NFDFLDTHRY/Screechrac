# SPATIAL ROLE: the build/test gate — machine-buildable proof that the scene graph holds.
# Self-contained: uses ONLY the GitHub-owned actions/checkout plus the runner's
# pre-installed Rust toolchain (no third-party actions), so it runs under the strictest
# repository Actions policies.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: cargo check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain (pre-installed on ubuntu-latest)
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: cargo check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: Walk the scene + run the hologram compliance scanner
        run: cargo run --quiet

      # The Facilitator web crate is a detached [workspace], so the root --workspace run
      # above does NOT build or test it. Build and test it explicitly.
      - name: cargo check + test (web crate)
        run: |
          cargo check --manifest-path web/Cargo.toml --all-targets
          cargo test --manifest-path web/Cargo.toml
